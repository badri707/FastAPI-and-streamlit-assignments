<style>
:root{--bg:#faf8f5;--fg:#24272b;--muted:#5d6268;--line:#dcd7d0;--accent:#a3122a;--card:#fff;--ok:#2f6b3a;--warn:#8a5a00;--bad:#a3122a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}main{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.15rem;margin:1.4em 0 .4em;border-bottom:2px solid var(--line);padding-bottom:4px}h3{font-size:1rem;margin:1em 0 .3em}
table{border-collapse:collapse;width:100%;background:var(--card);margin:.4em 0 1em;font-size:.9rem}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}th{background:#f1ede7}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.78rem;font-weight:600;border:1px solid currentColor}
.ok{color:var(--ok)}.partial,.degraded{color:var(--warn)}.unavailable,.failed,.bad{color:var(--bad)}
.note{color:var(--muted);font-size:.85rem}.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.kpi b{display:block;font-size:1.4rem}
nav{background:var(--fg);padding:8px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}nav a{color:#fff;text-decoration:none;font-size:.9rem}
nav .mode{margin-left:auto;background:var(--accent);color:#fff;padding:2px 10px;border-radius:10px;font-weight:700;font-size:.8rem}
.banner{background:#fff3f4;border:1px solid var(--accent);padding:8px 12px;border-radius:6px;margin:8px 0}
button,.btn{background:var(--accent);color:#fff;border:0;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:.9rem;text-decoration:none;display:inline-block}
input,select{padding:5px;border:1px solid var(--line);border-radius:4px}
.table-wrap{overflow-x:auto}
@media print{nav,.noprint{display:none}body{background:#fff}}
</style>
